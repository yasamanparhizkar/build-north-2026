<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Senior Helper — Spotlight demo</title>
  <style>
    :root { font-family: Inter, system-ui, 'Segoe UI', Arial, sans-serif; color: #1f2328; }
    body { margin: 0; background: #f6f7f9; }
    header.app { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 24px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e3e5e8; }
    header.app nav a { margin-right: 16px; color: #0b57d0; text-decoration: none; font-weight: 500; }
    main { display: grid; grid-template-columns: 340px 1fr; gap: 24px; padding: 24px; }
    .panel { position: sticky; top: 76px; align-self: start; background: #fff; border: 1px solid #e3e5e8; border-radius: 12px; padding: 16px; }
    .panel label { display: block; font-size: 13px; margin: 10px 0 4px; color: #57606a; }
    .panel select, .panel input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #c9ced6; border-radius: 6px; font: inherit; }
    .panel .row { display: flex; gap: 8px; margin-top: 12px; }
    .panel button { flex: 1; padding: 9px; border: 0; border-radius: 6px; background: #0b57d0; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .panel button.secondary { background: #e8eaed; color: #1f2328; }
    #log { margin-top: 12px; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; background: #f6f8fa; border-radius: 6px; padding: 8px; min-height: 60px; }
    section.card { background: #fff; border: 1px solid #e3e5e8; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; }
    section.card h2 { font-size: 15px; margin: 0 0 12px; color: #57606a; font-weight: 600; }
    .btn { padding: 10px 18px; border-radius: 8px; border: 1px solid #c9ced6; background: #fff; font: inherit; cursor: pointer; }
    .btn.primary { background: #c2e7ff; border-color: #c2e7ff; font-weight: 600; }
    .scrollbox { height: 150px; overflow: auto; border: 1px solid #e3e5e8; border-radius: 8px; padding: 8px; }
    .scrollbox div { padding: 6px 8px; border-bottom: 1px solid #f0f1f3; }
    .tilted { transform: rotate(-6deg) scale(1.08); display: inline-block; }
    #fixedHelp { position: fixed; left: 24px; bottom: 24px; z-index: 3; }
    #cornerBtn { position: absolute; right: 16px; top: 64px; }
    iframe { width: 100%; height: 90px; border: 1px dashed #c9ced6; border-radius: 8px; }
    .spacer { height: 900px; }
  </style>
</head>
<body>
  <header class="app">
    <strong>Mail Demo</strong>
    <nav aria-label="Main">
      <a href="#inbox" id="navInbox">Inbox</a>
      <a href="#sent" id="navSent">Sent</a>
      <a href="#settings" id="navSettings">Settings</a>
    </nav>
  </header>
  <button class="btn" id="cornerBtn">Account</button>

  <main>
    <aside class="panel" aria-label="Spotlight demo controls">
      <strong>Spotlight demo</strong>
      <label for="target">Target</label>
      <select id="target"></select>
      <label for="instruction">Instruction</label>
      <input id="instruction" value="Click the Record button.">
      <label><input type="checkbox" id="dismiss" checked style="width:auto"> Hide after the target is clicked</label>
      <div class="row">
        <button id="show">Show spotlight</button>
        <button id="hide" class="secondary">Hide</button>
      </div>
      <div id="log" aria-live="polite">Pick a target and press "Show spotlight". Press Esc to close.</div>
    </aside>

    <div>
      <section class="card">
        <h2>Simple buttons</h2>
        <button class="btn primary" id="compose">Compose</button>
        <button class="btn" id="record">Record</button>
        <button class="btn" id="send">Send</button>
        <button class="btn" id="hiddenBtn" style="display:none">Hidden button</button>
      </section>

      <section class="card">
        <h2>Scroll container</h2>
        <div class="scrollbox" id="scrollbox"></div>
      </section>

      <section class="card">
        <h2>Transformed element</h2>
        <span class="tilted"><button class="btn" id="tilted">Rotated & scaled</button></span>
      </section>

      <section class="card">
        <h2>Dynamic (re-rendered every 1.5 s, like React/Vue)</h2>
        <div id="dynamicHost"></div>
      </section>

      <section class="card">
        <h2>Same-origin iframe</h2>
        <iframe id="frame" title="Embedded widget"
          srcdoc="<body style='font-family:system-ui;margin:12px'><button id='frameBtn' style='padding:10px 16px'>Reply in frame</button></body>"></iframe>
      </section>

      <div class="spacer"></div>
      <section class="card">
        <h2>Far down the page</h2>
        <button class="btn" id="bottomBtn">Delete account</button>
      </section>
    </div>
  </main>

  <button class="btn primary" id="fixedHelp">Help</button>
  <script type="module" src="demo.js"></script>
</body>
</html>

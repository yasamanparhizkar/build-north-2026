<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: Arial, sans-serif; padding: 12px; margin: 0; }
    h3 { margin-top: 0; color: #1a73e8; }
    input, button { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #1557b0; }
    button.clear { background: #e8eaed; color: #333; }
    #status { margin-top: 10px; font-size: 12px; color: #444; background: #f1f3f4; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h3>👵 Senior Helper</h3>
  
  <label style="font-size:12px;">Gemini API Key (Free at aistudio.google.com):</label>
  <input type="password" id="apiKey" placeholder="Paste Gemini API Key..." />
  <button id="saveKey">Save API Key</button>

  <hr style="margin: 12px 0; border: 0; border-top: 1px solid #ddd;">

  <label style="font-size:12px;">Test Command (or use Voice on page):</label>
  <input type="text" id="manualCmd" placeholder="e.g., Click the Compose button" />
  <button id="sendCmd">Highlight Element</button>
  <button id="toggleVoice" style="background: #d93025;">🎤 Start Voice Listener on Page</button>
  <button id="clearBtn" class="clear">Clear Pointer</button>

  <div id="status">Ready. Open any page (like Gmail or Meet) to test!</div>

  <script src="popup.js"></script>
</body>
</html>
